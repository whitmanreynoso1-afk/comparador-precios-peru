<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>USADOS - Marketplace de Antigüedades y Tesoros</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hero-bg {
            /* Fondo con gradiente oscuro y enlace directo a antigüedades */
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), 
                        url('https://images.unsplash.com/photo-1544816155-12df9643f363?auto=format&fit=crop&w=1600&q=80');
            background-size: cover;
            background-position: center;
        }
    </style>
</head>
<body class="bg-stone-50 font-sans">
    
    <!-- Header -->
    <header class="bg-white shadow-sm p-4">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-4xl font-black text-stone-800 tracking-tighter">USADOS<span class="text-amber-700">.pe</span></h1>
            <button class="bg-amber-700 hover:bg-amber-800 text-white px-6 py-2 rounded-full font-bold transition">Vender Objeto</button>
        </div>
    </header>

    <!-- Hero Section -->
    <div class="hero-bg py-24 text-center text-white">
        <h2 class="text-5xl font-bold mb-6">Encuentra piezas con historia y valor</h2>
        <div class="max-w-3xl mx-auto bg-white p-2 rounded-full shadow-2xl flex items-center">
            <input type="text" placeholder="¿Qué antigüedad buscas hoy?" class="w-full p-4 text-stone-800 rounded-full outline-none px-6">
            <button class="bg-amber-700 text-white px-8 py-4 rounded-full font-bold hover:bg-amber-800 transition">Buscar</button>
        </div>
    </div>

    <!-- Categorías -->
    <div class="max-w-6xl mx-auto py-12 grid grid-cols-2 md:grid-cols-4 gap-6 text-center">
        <div class="p-8 bg-white rounded-3xl shadow-sm border border-stone-100 cursor-pointer hover:shadow-xl hover:-translate-y-2 transition-all">
            <div class="text-4xl mb-2">🏠</div>
            <p class="font-bold">Casas</p>
        </div>
        <div class="p-8 bg-white rounded-3xl shadow-sm border border-stone-100 cursor-pointer hover:shadow-xl hover:-translate-y-2 transition-all">
            <div class="text-4xl mb-2">🚗</div>
            <p class="font-bold">Vehículos</p>
        </div>
        <div class="p-8 bg-white rounded-3xl shadow-sm border border-stone-100 cursor-pointer hover:shadow-xl hover:-translate-y-2 transition-all">
            <div class="text-4xl mb-2">🛋️</div>
            <p class="font-bold">Enceres</p>
        </div>
        <div class="p-8 bg-white rounded-3xl shadow-sm border border-stone-100 cursor-pointer hover:shadow-xl hover:-translate-y-2 transition-all">
            <div class="text-4xl mb-2">💻</div>
            <p class="font-bold">Electrónicos</p>
        </div>
    </div>

</body>
</html>
