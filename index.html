<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComparaPerú - Búsqueda en Vivo</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col justify-between">

    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center gap-4">
            <span class="text-2xl font-black text-indigo-600">Compara<span class="text-emerald-500">Perú</span></span>
            <div class="w-1/2 flex">
                <input type="text" id="searchInput" placeholder="Busca un producto en la web..." class="w-full px-4 py-2 border border-gray-300 rounded-l-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                <button onclick="buscarEnInternet()" class="bg-indigo-600 text-white px-6 py-2 rounded-r-lg font-semibold hover:bg-indigo-700 transition text-sm">Buscar</button>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8 w-full flex-grow">
        <h2 id="tituloEstado" class="text-xl font-bold text-gray-800 mb-6">Resultados en vivo desde la red</h2>
        <div id="loader" class="hidden text-center py-8 text-indigo-600 font-semibold">Consultando precios en internet...</div>
        <div id="contenedorResultados" class="space-y-4"></div>
    </main>

    <footer class="bg-white border-t border-gray-200 py-4 text-center text-xs text-gray-500">
        ComparaPerú &copy; 2026 - Comparador de Precios en Vivo
    </footer>

    <script>
        async function buscarEnInternet() {
            const query = document.getElementById('searchInput').value.trim();
            const contenedor = document.getElementById('contenedorResultados');
            const loader = document.getElementById('loader');
            const titulo = document.getElementById('tituloEstado');

            loader.classList.remove('hidden');
            contenedor.innerHTML = "";

            try {
                // Petición al servidor backend que conecta con la red
                const respuesta = await fetch('/api/buscar?q=' + encodeURIComponent(query))}`);
                const productos = await respuesta.json();

                loader.classList.add('hidden');
                titulo.innerText = query ? `Resultados para: "${query}"` : "Todos los productos en la red";

                if (productos.length === 0) {
                    contenedor.innerHTML = `<div class="bg-white p-6 rounded-xl text-center text-gray-500">No se encontraron ofertas en internet para esta búsqueda.</div>`;
                    return;
                }

                productos.forEach(prod => {
                    // Ordenar tiendas de menor a mayor precio automáticamente
                    const tiendasOrdenadas = prod.tiendas.sort((a, b) => a.precio - b.precio);
                    const mejorTienda = tiendasOrdenadas[0];

                    let listaHtml = "";
                    tiendasOrdenadas.forEach((t, i) => {
                        const estilo = i === 0 ? "text-emerald-600 font-bold bg-emerald-50 px-2 py-1 rounded" : "text-gray-600 px-2 py-1";
                        listaHtml += `<div class="flex justify-between text-sm py-1 border-b border-gray-100"><span class="${estilo}">${t.nombre}</span><span class="${estilo}">S/ ${t.precio.toFixed(2)}</span></div>`;
                    });

                    const tarjeta = document.createElement('div');
                    tarjeta.className = "bg-white p-6 rounded-xl shadow-sm border border-gray-200 flex flex-col md:flex-row justify-between items-center gap-6";
                    tarjeta.innerHTML = `
                        <div class="w-full">
                            <span class="text-xs bg-emerald-100 text-emerald-800 font-semibold px-2.5 py-0.5 rounded-full">Mejor opción</span>
                            <h3 class="text-lg font-bold text-gray-900 mt-1">${prod.nombre}</h3>
                            <div class="mt-3 space-y-1 bg-gray-50 p-3 rounded-lg border border-gray-100">${listaHtml}</div>
                        </div>
                        <div class="w-full md:w-auto text-right flex flex-col justify-center flex-shrink-0">
                            <span class="text-xs text-gray-400">Precio más bajo</span>
                            <span class="text-xl font-black text-emerald-600 mb-2">S/ ${mejorTienda.precio.toFixed(2)}</span>
                            <button onclick="alert('Redirigiendo a ${mejorTienda.nombre}')" class="bg-indigo-600 text-white px-5 py-2.5 rounded-lg text-sm font-semibold hover:bg-indigo-700 transition">Ir a la Tienda</button>
                        </div>
                    `;
                    contenedor.appendChild(tarjeta);
                });

            } catch (error) {
                loader.classList.add('hidden');
                contenedor.innerHTML = `<div class="bg-white p-6 rounded-xl text-center text-red-500">Error al conectar con el servidor de búsqueda en vivo. Asegúrate de ejecutar el backend.</div>`;
            }
        }

        // Carga inicial al abrir la página
        window.onload = () => buscarEnInternet();
    </script>
</body>
</html>
